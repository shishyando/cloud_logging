services:
  clickhouse-server:
    image: yandex/clickhouse-server
    container_name: clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./logbroker_clickhouse_database:/var/lib/clickhouse
      - ./init.d:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
      - "9000:9000"
    expose:
      - 9000
      - 8123
    restart: always
